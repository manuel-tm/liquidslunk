[workspace]
members = ["crates/slunk", "crates/slunk-cli", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
slunk = { path = "crates/slunk" }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
